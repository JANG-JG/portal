<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>5분 탐험 수준 테스트 | 빨간패드공부</title>
    <link rel="manifest" href="/study/manifest.json">
    <link rel="icon" type="image/png" sizes="64x64" href="/study/icons/favicon-64.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/study/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/study/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#ff7a45">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="빨간패드공부">
    <link rel="stylesheet" href="/css/pretendard.css">
    <link rel="stylesheet" href="/css/study.css">
    <link rel="stylesheet" href="/css/study-play.css">
    <link rel="stylesheet" href="/css/study-visuals.css">
    <link rel="stylesheet" href="/css/study-tablet.css">
    <link rel="stylesheet" href="/css/study-phase3.css">
</head>
<body>
    <div class="study-shell">
        <header class="study-topbar">
            <div class="study-brand">
                <span class="study-brand-icon" aria-hidden="true">🧭</span>
                <div>
                    <h1>5분 탐험 수준 테스트</h1>
                    <small id="testSubLabel" style="color: #64748b; font-weight: 700;">재미있는 문제를 풀며 딱 맞는 레벨을 찾아요</small>
                </div>
            </div>
            <div class="study-topbar-actions">
                <button type="button" id="btnWakeLockToggle" class="study-btn study-btn-outline is-active" aria-pressed="true">💡 화면 유지 중</button>
                <button type="button" id="btnTtsModeToggle" class="study-btn study-btn-outline" title="자연스러운 AI 선생님 음성과 기기 음성을 전환해요">🎙️ AI 자연 음성</button>
                <a id="btnBackToStudy" href="/study" class="study-link-btn study-btn-outline">⬅️ 학습실로</a>
            </div>
        </header>

        <main>
            <section class="study-card" id="testSetupCard">
                <h2 style="margin: 0 0 6px; font-size: 1.25rem;">🎯 측정할 영역을 골라 보세요</h2>
                <p style="margin: 0 0 12px; color: #475569; font-weight: 700; font-size: 0.92rem;">추천 6개 영역이 기본 선택되어 있어요. 원하는 과목만 골라 과목별 3문제씩 풀어요.</p>
                <div class="test-preset-row" role="group" aria-label="영역 빠른 선택">
                    <button type="button" class="study-btn study-btn-outline test-preset-btn" data-preset="all">✨ 추천 6영역 전체</button>
                    <button type="button" class="study-btn study-btn-outline test-preset-btn" data-preset="core">📚 기초 3과목 (한글·수학·영어)</button>
                    <button type="button" class="study-btn study-btn-outline test-preset-btn" data-preset="explore">🔬 탐험 3과목 (자연·역사·사고력)</button>
                </div>
                <div class="test-subject-grid" id="testSubjectGrid">
                    <label class="test-subject-option"><input type="checkbox" name="testSubject" value="korean" checked><span>🇰🇷 한글</span></label>
                    <label class="test-subject-option"><input type="checkbox" name="testSubject" value="math" checked><span>🔢 숫자·수학</span></label>
                    <label class="test-subject-option"><input type="checkbox" name="testSubject" value="english" checked><span>🔤 영어</span></label>
                    <label class="test-subject-option"><input type="checkbox" name="testSubject" value="science" checked><span>🔬 자연·과학</span></label>
                    <label class="test-subject-option"><input type="checkbox" name="testSubject" value="history" checked><span>🏛️ 역사·문화</span></label>
                    <label class="test-subject-option"><input type="checkbox" name="testSubject" value="logic" checked><span>🧩 관찰·사고력</span></label>
                </div>
                <button type="button" id="btnStartSelectedTest" class="study-btn study-btn-primary" style="width: 100%; min-block-size: 50px; font-size: 1.08rem;">🚀 선택한 영역 테스트 시작하기</button>
            </section>

            <section class="study-card" id="testProgressCard" hidden>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 800;">
                    <span id="testSubjectBadge" class="level-badge">탐험 준비 중</span>
                    <span id="testStepLabel">0 / 18</span>
                </div>
                <progress id="testProgressBar" value="0" max="18" style="width: 100%; height: 14px; accent-color: #ff7a45;"></progress>
            </section>

            <section class="study-card" id="testQuestionCard" hidden>
                <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px;">
                    <h2 id="testPrompt" style="margin: 0; font-size: clamp(1.15rem, 3vw, 1.4rem);">문제를 준비하고 있어요...</h2>
                    <button type="button" id="btnSpeakQuestion" class="study-btn study-btn-secondary">🔊 읽어주기</button>
                </div>

                <div id="testVisualBox" style="text-align: center; font-size: clamp(2.4rem, 7vw, 3.8rem); padding: 20px 10px; background: #fffbeb; border-radius: 18px; margin-bottom: 14px; letter-spacing: 6px;"></div>
                <p id="testEquationText" style="text-align: center; font-size: 1.5rem; font-weight: 800; color: #334155; margin: 0 0 14px;"></p>

                <div class="choice-grid" id="testChoicesGrid"></div>
                <p id="testFeedbackBanner" aria-live="polite" style="text-align: center; font-weight: 800; font-size: 1.1rem; min-height: 1.6em; margin: 14px 0 0;"></p>
            </section>

            <section class="study-card" id="testResultCard" hidden>
                <div style="text-align: center; padding: 12px 4px;">
                    <div style="font-size: 3.4rem;" aria-hidden="true">🎉</div>
                    <h2 style="margin: 8px 0; font-size: 1.5rem;">탐험 완료! 우리 아이 맞춤 레벨을 찾았어요</h2>
                    <p id="testResultSummary" style="color: #475569; font-weight: 700;"></p>
                    <div class="levels-grid" id="testResultLevels" style="margin: 18px 0;"></div>
                    <a id="btnFinishReturn" href="/study" class="study-link-btn study-btn-primary" style="width: 100%; max-width: 340px;">
                        🎒 학습실로 돌아가기
                    </a>
                </div>
            </section>
        </main>
    </div>

    <div id="studyToast" class="toast-banner" aria-live="polite" hidden></div>

    <script src="/js/study-pwa.js" defer></script>
    <script src="/js/study-tablet.js" defer></script>
    <script src="/js/study-tts.js" defer></script>
    <script src="/js/study-test.js" defer></script>
    <script src="/api/jg-ui" data-nav="false" data-ticker="false" defer></script>
</body>
</html>

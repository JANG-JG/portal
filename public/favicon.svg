<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 다크 프리미엄 배경 그라데이션 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- JG 레터마크 3색 통합 그라데이션 (🩸 혈압 로즈레드 -> 📰 뉴스 로얄블루 -> 💰 자산 에메랄드그린) -->
    <linearGradient id="jgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- 텍스트 미세 글로우 효과 -->
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 라운드 스퀘어 베이스 -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="8" />

  <!-- 상단 서비스 상징 3색 인디케이터 (혈압·뉴스·자산) -->
  <g transform="translate(0, -10)">
    <circle cx="206" cy="118" r="14" fill="#f43f5e" />
    <circle cx="256" cy="118" r="14" fill="#38bdf8" />
    <circle cx="306" cy="118" r="14" fill="#10b981" />
  </g>

  <!-- 중앙 JG 볼드 타이포그래피 -->
  <text x="256" y="342" 
        font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', system-ui, sans-serif" 
        font-size="220" 
        font-weight="900" 
        letter-spacing="-12"
        text-anchor="middle" 
        fill="url(#jgGrad)"
        filter="url(#subtleGlow)">JG</text>

  <!-- 하단 3색 통합 언더바 -->
  <rect x="136" y="385" width="240" height="14" rx="7" fill="url(#jgGrad)" opacity="0.9" />
</svg>

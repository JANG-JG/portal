<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JG 통합 포털 - 로그인</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#09090b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="JG 포털">
    <meta name="color-scheme" content="dark">
    <link rel="stylesheet" href="/css/pretendard.css?v=20261024_111357">
    <link rel="stylesheet" href="/css/style.css?v=20261024_111357">
    <style>
        html {
            background-color: #09090b !important;
            background: #09090b !important;
            min-height: 100%;
        }
        body.login-body {
            background-color: #09090b !important;
            background: #09090b !important;
            background-image: none !important;
            color: #f4f4f5 !important;
            font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }
        .login-card {
            background-color: #121215 !important;
            border: 1px solid #27272a !important;
            border-radius: 12px !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4) !important;
            max-width: 400px;
            width: 100%;
            padding: 2rem !important;
            box-sizing: border-box;
        }
        .login-header h2 {
            color: #f4f4f5 !important;
            font-size: 1.35rem;
            font-weight: 800;
            margin: 0.5rem 0 0.25rem;
            letter-spacing: -0.02em;
        }
        .login-header p {
            color: #71717a !important;
            font-size: 0.82rem;
            margin: 0 0 1.5rem;
        }
        .form-group label {
            color: #a1a1aa !important;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
            display: block;
        }
        .form-group input {
            background-color: #18181b !important;
            border: 1px solid #27272a !important;
            border-radius: 6px !important;
            color: #f4f4f5 !important;
            font-size: 0.88rem;
            padding: 0.65rem 0.85rem;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.12s ease;
        }
        .form-group input:focus {
            border-color: #3f3f46 !important;
        }
        .checkbox-label {
            color: #a1a1aa !important;
            font-size: 0.78rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
        }
        .btn-primary {
            background: #27272a !important;
            border: 1px solid #3f3f46 !important;
            border-radius: 6px !important;
            color: #f4f4f5 !important;
            font-weight: 700;
            font-size: 0.88rem;
            padding: 0.75rem;
            width: 100%;
            cursor: pointer;
            box-shadow: none !important;
            transition: all 0.12s ease;
            margin-top: 1rem;
        }
        .btn-primary:hover {
            background: #3f3f46 !important;
            border-color: #52525b !important;
        }
        .error-msg {
            background: rgba(244, 63, 94, 0.12) !important;
            border: 1px solid rgba(244, 63, 94, 0.25) !important;
            color: #f43f5e !important;
            border-radius: 6px;
            padding: 0.6rem 0.75rem;
            font-size: 0.8rem;
            margin-top: 0.75rem;
        }
    </style>
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">🏠</div>
            <h2>JG 통합 포털</h2>
            <p>단일 계정으로 모든 서비스를 안전하게 이용하세요</p>
        </div>

        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="username">아이디</label>
                <input type="text" id="username" name="username" placeholder="아이디 입력" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="비밀번호 입력" required autocomplete="current-password">
            </div>

            <div class="form-options">
                <label class="checkbox-label">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <span>개인 기기에서 로그인 상태 유지 (7일)</span>
                </label>
            </div>

            <div id="errorMessage" class="error-msg" style="display: none;"></div>

            <button type="submit" class="btn-primary" id="btnSubmit">로그인</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const errorEl = document.getElementById('errorMessage');
            const btnSubmit = document.getElementById('btnSubmit');

            errorEl.style.display = 'none';
            btnSubmit.disabled = true;
            btnSubmit.textContent = '로그인 중...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, rememberMe })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = data.redirect || '/';
                } else {
                    errorEl.textContent = data.message || '로그인에 실패했습니다.';
                    errorEl.style.display = 'block';
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = '로그인';
                }
            } catch (err) {
                errorEl.textContent = '서버 연결에 실패했습니다.';
                errorEl.style.display = 'block';
                btnSubmit.disabled = false;
                btnSubmit.textContent = '로그인';
            }
        });

        // 🌟 [SSO 단일 로그아웃 동기화] 포털에서 로그아웃 시 3개 서브 서비스 세션도 완벽 파기
        (function syncSingleSignOut() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('logout') === 'success') {
                const subServices = [
                    'https://blood.j-jg.cc/logout?local=1',
                    'https://asset.j-jg.cc/logout?local=1',
                    'https://news.j-jg.cc/logout?local=1'
                ];
                subServices.forEach(url => {
                    fetch(url, { credentials: 'include', mode: 'no-cors' }).catch(() => {});
                });
            }
        })();

        // 🌟 [PWA 서비스 워커 등록]
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => {
                        console.log('[PWA] Service Worker registered on login:', reg.scope);
                    })
                    .catch(err => {
                        console.warn('[PWA] Service Worker registration failed on login:', err);
                    });
            });
        }
    </script>
</body>
</html>

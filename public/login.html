<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JG 통합 포털 - 로그인</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#09090b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="JG 포털">
    <meta name="color-scheme" content="dark">
    <link rel="stylesheet" href="/css/pretendard.css?v=20261025_114101">
    <link rel="stylesheet" href="/css/style.css?v=20261025_114101">
    <link rel="stylesheet" href="/css/login.css?v=20261025_114101">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">🏠</div>
            <h2 id="loginTitle">JG 통합 포털</h2>
            <p id="loginSubtitle">단일 계정으로 모든 서비스를 안전하게 이용하세요</p>
        </div>

        <!-- 👨‍👩‍👧‍👦 / 🔑 탭 전환 바 (인증된 가족 기기 또는 초대 진입 시 동적 활성화) -->
        <div class="login-tabs" style="display: none;">
            <button type="button" class="login-tab-btn active" id="tabBtnFamily" onclick="switchLoginMode('family')">
                <span>👨‍👩‍👧‍👦</span><span>가족 간편입장</span>
            </button>
            <button type="button" class="login-tab-btn" id="tabBtnAdmin" onclick="switchLoginMode('admin')">
                <span>🔑</span><span>아이디 로그인</span>
            </button>
        </div>

        <!-- 👨‍👩‍👧‍👦 우리 가족 간편 입장 섹션 -->
        <div id="familyLoginSection" style="display: none;">
            <!-- 1) 가족 프로필 선택 그리드 -->
            <div id="familyPickerView">
                <div class="family-chips-grid" id="familyChipsContainer">
                    <div style="color: #71717a; font-size: 0.82rem; grid-column: 1 / -1; text-align: center; padding: 1rem 0;">
                        가족 목록을 불러오는 중...
                    </div>
                </div>
            </div>

            <!-- 2) 선택된 가족 PIN 입력 패널 -->
            <div id="familyPinView" style="display: none;">
                <div class="selected-member-card">
                    <div class="selected-member-left">
                        <span id="selectedMemberEmoji" style="font-size: 1.4rem;">👩</span>
                        <span id="selectedMemberName">가족</span>
                    </div>
                    <button type="button" class="btn-change-member" onclick="resetFamilySelection()">다른 가족 선택</button>
                </div>

                <div class="pin-dots-wrap" id="pinDotsWrap" onclick="focusPinInput()" title="숫자 키패드 열기">
                    <div class="pin-dot"></div>
                    <div class="pin-dot"></div>
                    <div class="pin-dot"></div>
                    <div class="pin-dot"></div>
                    <div class="pin-dot"></div>
                    <div class="pin-dot"></div>
                </div>

                <!-- 모바일 네이티브 키패드 및 물리 키보드 바인딩 숨김 인풋 -->
                <input type="password" id="familyPinHiddenInput" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" style="position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px;">

                <!-- 화면 가상 3x4 키패드 -->
                <div class="numpad-grid">
                    <button type="button" class="numpad-btn" data-key="1">1</button>
                    <button type="button" class="numpad-btn" data-key="2">2</button>
                    <button type="button" class="numpad-btn" data-key="3">3</button>
                    <button type="button" class="numpad-btn" data-key="4">4</button>
                    <button type="button" class="numpad-btn" data-key="5">5</button>
                    <button type="button" class="numpad-btn" data-key="6">6</button>
                    <button type="button" class="numpad-btn" data-key="7">7</button>
                    <button type="button" class="numpad-btn" data-key="8">8</button>
                    <button type="button" class="numpad-btn" data-key="9">9</button>
                    <button type="button" class="numpad-btn btn-action" data-key="clear">초기화</button>
                    <button type="button" class="numpad-btn" data-key="0">0</button>
                    <button type="button" class="numpad-btn btn-action" data-key="backspace">⌫</button>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="familyRememberMe" checked>
                        <span>이 기기에서 계속 로그인 유지 (365일)</span>
                    </label>
                </div>
            </div>

            <div id="familyErrorMessage" class="error-msg" style="display: none;"></div>

            <div class="family-unlink-wrap" style="text-align: center; margin-top: 1.25rem;">
                <button type="button" class="btn-unlink-device" onclick="unlinkFamilyDevice()">
                    이 기기에서 간편입장 해제
                </button>
            </div>
        </div>

        <!-- 🔑 일반 계정/아이디 로그인 섹션 -->
        <div id="adminLoginSection" style="display: block;">
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">아이디</label>
                    <input type="text" id="username" name="username" placeholder="아이디 입력" required autocomplete="username">
                </div>

                <div class="form-group" style="margin-top: 0.75rem;">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" placeholder="비밀번호 입력" required autocomplete="current-password">
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span>개인 기기에서 로그인 상태 유지 (7일)</span>
                    </label>
                </div>

                <!-- 🌟 비밀번호 분실 찾기 링크 -->
                <div class="form-sub-links">
                    <button type="button" class="btn-forgot-password" onclick="openResetPasswordModal()">
                        비밀번호를 잊으셨나요?
                    </button>
                </div>

                <div id="errorMessage" class="error-msg" style="display: none;"></div>

                <button type="submit" class="btn-primary" id="btnSubmit">로그인</button>
            </form>
        </div>
    </div>

    <!-- 🔐 비밀번호 분실 초기화 모달 -->
    <div id="resetPasswordModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <span style="font-size: 1.5rem;">🔐</span>
                <h3>비밀번호 분실 초기화</h3>
            </div>
            <p class="modal-desc">
                가입하신 아이디와 등록된 이메일 주소를 입력하시면<br>해당 이메일로 임시 비밀번호를 발송해 드립니다.
            </p>
            <form id="resetPasswordForm" onsubmit="handleResetPassword(event)">
                <div class="form-group">
                    <label for="resetUsername">아이디</label>
                    <input type="text" id="resetUsername" placeholder="아이디 입력" required autocomplete="username">
                </div>
                <div class="form-group" style="margin-top: 0.75rem;">
                    <label for="resetEmail">등록된 이메일 주소</label>
                    <input type="email" id="resetEmail" placeholder="example@email.com" required autocomplete="email">
                </div>
                <div style="margin-top: 0.85rem; font-size: 0.78rem; color: #a1a1aa; line-height: 1.45; background: #18181b; padding: 0.65rem 0.8rem; border-radius: 6px; border: 1px solid #27272a;">
                    💡 <strong>가족 PIN 분실 시:</strong> 관리자에게 6자리 PIN 초기화를 요청해 주시기 바랍니다.
                </div>
                <div id="resetPasswordError" class="error-msg" style="display: none;"></div>
                <div id="resetPasswordSuccess" class="success-msg" style="display: none;"></div>
                <div style="display: flex; gap: 0.5rem; margin-top: 1.25rem;">
                    <button type="button" class="btn-secondary" onclick="closeResetPasswordModal()" style="flex: 1;">닫기</button>
                    <button type="submit" class="btn-primary" id="btnSubmitReset" style="flex: 1.5; margin-top: 0;">임시 비밀번호 발송</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 🔑 최초 접속 PIN 변경 모달 -->
    <div id="pinChangeModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <span style="font-size: 1.5rem;">🔑</span>
                <h3 id="pinChangeTitle">나만의 6자리 PIN 설정</h3>
            </div>
            <p class="modal-desc" id="pinChangeDesc">
                반갑습니다! 앞으로 사용할 나만의 6자리 숫자 PIN을 설정해 주세요.
            </p>
            <div class="form-group">
                <label for="newPinInput">새 6자리 PIN</label>
                <input type="password" id="newPinInput" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="숫자 6자리 입력" autocomplete="new-password">
            </div>
            <div class="form-group" style="margin-top: 0.75rem;">
                <label for="confirmPinInput">새 PIN 확인</label>
                <input type="password" id="confirmPinInput" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="숫자 6자리 한 번 더 입력" autocomplete="new-password">
            </div>
            <div id="pinChangeError" class="error-msg" style="display: none;"></div>
            <button type="button" class="btn-primary" id="btnSubmitNewPin" style="margin-top: 1.25rem;">PIN 저장 및 입장하기</button>
        </div>
    </div>

    <script src="/js/login-family.js?v=20261025_114101" defer></script>
    <script src="/js/login-reset.js?v=20261025_114101" defer></script>
</body>
</html>

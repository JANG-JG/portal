<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JG 통합 포털 - 로그인</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">🏠</div>
            <h2>JG 통합 포털</h2>
            <p>단일 계정으로 모든 서비스를 안전하게 이용하세요</p>
        </div>

        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="username">아이디</label>
                <input type="text" id="username" name="username" placeholder="아이디 입력" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="비밀번호 입력" required autocomplete="current-password">
            </div>

            <div class="form-options">
                <label class="checkbox-label">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <span>개인 기기에서 로그인 상태 유지 (7일)</span>
                </label>
            </div>

            <div id="errorMessage" class="error-msg" style="display: none;"></div>

            <button type="submit" class="btn-primary" id="btnSubmit">로그인</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const errorEl = document.getElementById('errorMessage');
            const btnSubmit = document.getElementById('btnSubmit');

            errorEl.style.display = 'none';
            btnSubmit.disabled = true;
            btnSubmit.textContent = '로그인 중...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, rememberMe })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = data.redirect || '/';
                } else {
                    errorEl.textContent = data.message || '로그인에 실패했습니다.';
                    errorEl.style.display = 'block';
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = '로그인';
                }
            } catch (err) {
                errorEl.textContent = '서버 연결에 실패했습니다.';
                errorEl.style.display = 'block';
                btnSubmit.disabled = false;
                btnSubmit.textContent = '로그인';
            }
        });
    </script>
</body>
</html>

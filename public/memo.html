<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이디어 & 메모장 - JG 포털</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="manifest" href="/manifest.json?v=2">
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="JG 메모">
    <meta name="color-scheme" content="light">

    <!-- 스타일시트 -->
    <link rel="stylesheet" href="/css/pretendard.css?v=20261018_v1">
    <link rel="stylesheet" href="/css/style.css?v=20261018_v1">
    <link rel="stylesheet" href="/css/quill.snow.css">

    <link rel="stylesheet" href="/css/memo.css?v=20261020_v1">
</head>
<body>
    <!-- 🌐 JG 통합 상단 내비게이션 바 -->
    <div id="unified-nav-root" style="min-height: 54px;"></div>

    <main class="memo-app-container">
        <!-- 1. 헤더 배너 -->
        <header class="memo-banner">
            <div class="memo-banner-title">
                <h1>💡 아이디어 & 메모장</h1>
                <p>떠오른 영감, 중요한 할 일 목록, 프로젝트 메모를 서식과 함께 깔끔하게 기록하세요.</p>
            </div>
            <div class="memo-stats-chips">
                <span class="memo-stat-chip">전체 <strong id="statTotalCount">0</strong></span>
                <span class="memo-stat-chip">📌 고정 <strong id="statPinnedCount">0</strong></span>
                <span class="memo-stat-chip">✅ 할 일 <strong id="statTodoCount">0</strong></span>
                <span class="memo-stat-chip">📰 뉴스스크랩 <strong id="statScrapCount">0</strong></span>
            </div>
        </header>

        <!-- 2. 빠른 메모 등록기 (Quill 경량 리치에디터 탑재) -->
        <section class="memo-composer-card">
            <input type="text" id="memoInputTitle" class="memo-input-title" placeholder="제목 또는 핵심 키워드 (선택)..." maxlength="100">
            
            <!-- Quill 에디터 마운트 영역 -->
            <div id="memoQuillEditor"></div>

            <div class="memo-composer-toolbar">
                <div class="memo-options-group">
                    <!-- 카테고리 선택 칩 -->
                    <div class="memo-category-chips">
                        <input type="radio" name="memoCategory" id="catIdea" value="idea" class="memo-chip-input" checked>
                        <label for="catIdea" class="memo-chip-label">💡 아이디어</label>

                        <input type="radio" name="memoCategory" id="catTodo" value="todo" class="memo-chip-input">
                        <label for="catTodo" class="memo-chip-label">✅ 할 일</label>

                        <input type="radio" name="memoCategory" id="catMemo" value="memo" class="memo-chip-input">
                        <label for="catMemo" class="memo-chip-label">📝 일반</label>

                        <input type="radio" name="memoCategory" id="catImportant" value="important" class="memo-chip-input">
                        <label for="catImportant" class="memo-chip-label">⭐ 중요</label>

                        <input type="radio" name="memoCategory" id="catScrap" value="scrap" class="memo-chip-input">
                        <label for="catScrap" class="memo-chip-label">📰 뉴스스크랩</label>
                    </div>

                    <!-- 포스트잇 색상 선택 -->
                    <div class="memo-color-picker">
                        <input type="radio" name="memoColor" id="colorYellow" value="#fef3c7" class="memo-color-input" checked>
                        <label for="colorYellow" class="memo-color-dot" style="background:#fef3c7;" title="기본 노랑"></label>

                        <input type="radio" name="memoColor" id="colorBlue" value="#e0f2fe" class="memo-color-input">
                        <label for="colorBlue" class="memo-color-dot" style="background:#e0f2fe;" title="하늘색"></label>

                        <input type="radio" name="memoColor" id="colorGreen" value="#dcfce7" class="memo-color-input">
                        <label for="colorGreen" class="memo-color-dot" style="background:#dcfce7;" title="연초록"></label>

                        <input type="radio" name="memoColor" id="colorPurple" value="#f3e8ff" class="memo-color-input">
                        <label for="colorPurple" class="memo-color-dot" style="background:#f3e8ff;" title="연보라"></label>

                        <input type="radio" name="memoColor" id="colorRed" value="#fee2e2" class="memo-color-input">
                        <label for="colorRed" class="memo-color-dot" style="background:#fee2e2;" title="연분홍"></label>
                    </div>

                    <!-- 상단 고정 체크 -->
                    <label class="memo-pin-check-label">
                        <input type="checkbox" id="memoPinCheck">
                        <span>📌 상단 고정</span>
                    </label>
                </div>

                <button type="button" class="btn-memo-submit" onclick="submitNewMemo()">
                    <span>✨</span>
                    <span>메모 등록</span>
                </button>
            </div>
        </section>

        <!-- 3. 컨트롤 바 (필터 탭 + 검색 + 뷰 토글) -->
        <div class="memo-controls-bar">
            <div class="memo-filter-tabs">
                <button type="button" class="memo-tab-btn active" onclick="filterMemos('all', this)">
                    <span>전체보기</span>
                    <span class="memo-tab-count" id="countAll">0</span>
                </button>
                <button type="button" class="memo-tab-btn" onclick="filterMemos('pinned', this)">
                    <span>📌 고정됨</span>
                    <span class="memo-tab-count" id="countPinned">0</span>
                </button>
                <button type="button" class="memo-tab-btn" onclick="filterMemos('idea', this)">
                    <span>💡 아이디어</span>
                    <span class="memo-tab-count" id="countIdea">0</span>
                </button>
                <button type="button" class="memo-tab-btn" onclick="filterMemos('todo', this)">
                    <span>✅ 할 일</span>
                    <span class="memo-tab-count" id="countTodo">0</span>
                </button>
                <button type="button" class="memo-tab-btn" onclick="filterMemos('memo', this)">
                    <span>📝 일반</span>
                    <span class="memo-tab-count" id="countMemo">0</span>
                </button>
                <button type="button" class="memo-tab-btn" onclick="filterMemos('important', this)">
                    <span>⭐ 중요</span>
                    <span class="memo-tab-count" id="countImportant">0</span>
                </button>
                <button type="button" class="memo-tab-btn" onclick="filterMemos('scrap', this)">
                    <span>📰 뉴스스크랩</span>
                    <span class="memo-tab-count" id="countScrap">0</span>
                </button>
            </div>

            <div class="memo-tools-group">
                <div class="memo-search-box">
                    <span>🔍</span>
                    <input type="text" id="memoSearchInput" class="memo-search-input" placeholder="메모 검색..." oninput="handleMemoSearch(this.value)">
                </div>
                <div class="memo-view-toggle">
                    <button type="button" class="memo-view-btn active" id="btnViewGrid" onclick="setMemoView('grid')" title="그리드 뷰">⊞</button>
                    <button type="button" class="memo-view-btn" id="btnViewList" onclick="setMemoView('list')" title="리스트 뷰">☰</button>
                </div>
            </div>
        </div>

        <!-- 4. 메모 카드 그리드 / 리스트 -->
        <div id="memoContainerView" class="memo-container-view grid-view">
            <!-- 자바스크립트로 메모 카드 동적 주입 -->
            <div class="memo-empty-state">
                <span class="memo-empty-icon">⏳</span>
                <h3>메모 목록을 불러오는 중입니다...</h3>
            </div>
        </div>
    </main>

    <!-- ========================================== -->
    <!-- ✏️ 메모 수정 모달 (Quill 에디터 탑재) -->
    <!-- ========================================== -->
    <div id="memoEditModal" class="memo-modal-backdrop" style="display: none;" onclick="if(event.target===this) closeEditMemoModal();">
        <div class="memo-modal-dialog">
            <div class="memo-modal-header">
                <h3>✏️ 메모 수정</h3>
                <button type="button" class="memo-modal-close-btn" onclick="closeEditMemoModal()" aria-label="닫기">✕</button>
            </div>

            <div class="memo-modal-body">
                <input type="hidden" id="editMemoId">
                
                <div style="margin-bottom: 0.85rem;">
                    <label style="font-size: 0.82rem; font-weight: 700; color: #475569; display: block; margin-bottom: 0.35rem;">제목 (선택)</label>
                    <input type="text" id="editMemoTitle" class="memo-input-title" style="border: 1px solid #cbd5e1; border-radius: 0.5rem; padding: 0.5rem 0.75rem; background: #fff; font-size: 0.95rem; width: 100%; box-sizing: border-box;" placeholder="제목을 입력하세요..." maxlength="100">
                </div>

                <div style="margin-bottom: 0.85rem;">
                    <label style="font-size: 0.82rem; font-weight: 700; color: #475569; display: block; margin-bottom: 0.35rem;">내용</label>
                    <!-- 수정용 Quill 에디터 마운트 -->
                    <div id="editMemoQuill"></div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; margin-top: 1rem; padding-top: 0.85rem; border-top: 1px solid #f1f5f9;">
                    <!-- 카테고리 -->
                    <div class="memo-category-chips">
                        <input type="radio" name="editMemoCategory" id="editCatIdea" value="idea" class="memo-chip-input">
                        <label for="editCatIdea" class="memo-chip-label">💡 아이디어</label>

                        <input type="radio" name="editMemoCategory" id="editCatTodo" value="todo" class="memo-chip-input">
                        <label for="editCatTodo" class="memo-chip-label">✅ 할 일</label>

                        <input type="radio" name="editMemoCategory" id="editCatMemo" value="memo" class="memo-chip-input">
                        <label for="editCatMemo" class="memo-chip-label">📝 일반</label>

                        <input type="radio" name="editMemoCategory" id="editCatImportant" value="important" class="memo-chip-input">
                        <label for="editCatImportant" class="memo-chip-label">⭐ 중요</label>

                        <input type="radio" name="editMemoCategory" id="editCatScrap" value="scrap" class="memo-chip-input">
                        <label for="editCatScrap" class="memo-chip-label">📰 뉴스스크랩</label>
                    </div>

                    <!-- 색상 -->
                    <div class="memo-color-picker">
                        <input type="radio" name="editMemoColor" id="editColorYellow" value="#fef3c7" class="memo-color-input">
                        <label for="editColorYellow" class="memo-color-dot" style="background:#fef3c7;"></label>

                        <input type="radio" name="editMemoColor" id="editColorBlue" value="#e0f2fe" class="memo-color-input">
                        <label for="editColorBlue" class="memo-color-dot" style="background:#e0f2fe;"></label>

                        <input type="radio" name="editMemoColor" id="editColorGreen" value="#dcfce7" class="memo-color-input">
                        <label for="editColorGreen" class="memo-color-dot" style="background:#dcfce7;"></label>

                        <input type="radio" name="editMemoColor" id="editColorPurple" value="#f3e8ff" class="memo-color-input">
                        <label for="editColorPurple" class="memo-color-dot" style="background:#f3e8ff;"></label>

                        <input type="radio" name="editMemoColor" id="editColorRed" value="#fee2e2" class="memo-color-input">
                        <label for="editColorRed" class="memo-color-dot" style="background:#fee2e2;"></label>
                    </div>
                </div>

                <div style="margin-top: 0.85rem;">
                    <label class="memo-pin-check-label">
                        <input type="checkbox" id="editMemoPinCheck">
                        <span>📌 상단 고정</span>
                    </label>
                </div>
            </div>

            <div class="memo-modal-footer">
                <button type="button" class="memo-modal-btn cancel" onclick="closeEditMemoModal()">취소</button>
                <button type="button" class="memo-modal-btn save" onclick="submitEditMemo()">저장 완료</button>
            </div>
        </div>
    </div>

    <!-- 토스트 피드백 엘리먼트 -->
    <div id="memoToast" class="memo-toast">
        <span id="memoToastIcon">✅</span>
        <span id="memoToastMsg">메시지</span>
    </div>

    <!-- 스크립트 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="/js/quill.js"></script>
    <script src="/js/memo.js?v=20261020_v1"></script>

    <!-- 🚀 JG 통합 UI 런처 (상단 내비바 + 하단 뉴스/속보 티커 자동 로드) -->
    <script src="/js/jg-ui.js?v=20261020_220131" defer></script>
</body>
</html>

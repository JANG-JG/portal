<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오프라인 대기 중 - JG 포털</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="theme-color" content="#2563eb">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            line-height: 1.6;
        }

        .offline-card {
            background: var(--card-bg);
            max-width: 440px;
            width: 100%;
            border-radius: 1.25rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            padding: 2.25rem 2rem;
            text-align: center;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-wrapper {
            width: 72px;
            height: 72px;
            background: #eff6ff;
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem auto;
            border: 2px solid #dbeafe;
        }

        .icon-wrapper svg {
            width: 36px;
            height: 36px;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.6rem;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            word-break: keep-all;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 1.75rem;
            transition: all 0.3s ease;
        }

        .status-badge.offline {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fee2e2;
        }

        .status-badge.online {
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.85rem 1.25rem;
            border-radius: 0.75rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        .btn-primary:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .footer-hint {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon-wrapper">
            <!-- Wi-Fi Off SVG -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
        </div>

        <h1>인터넷 연결이 원활하지 않습니다</h1>
        <p>Wi-Fi 신호가 약하거나 모바일 데이터 연결이 끊어졌을 수 있습니다. 네트워크가 감지되면 자동으로 연결됩니다.</p>

        <div id="status-badge" class="status-badge offline">
            <span>🔴</span>
            <span id="status-text">오프라인 대기 중</span>
        </div>

        <div class="actions">
            <button type="button" class="btn btn-primary" id="retry-btn" onclick="handleRetry()">
                🔄 다시 시도
            </button>
            <a href="https://j-jg.cc/" class="btn btn-secondary">
                🏠 JG 포털 홈으로 이동
            </a>
            <button type="button" class="btn btn-secondary" onclick="window.history.back()" style="font-size: 0.85rem; padding: 0.65rem;">
                ← 이전 페이지로
            </button>
        </div>

        <div class="footer-hint">
            💡 앞서 방문하셨던 메인 대시보드 및 기본 화면은 오프라인 캐시를 통해 확인하실 수 있습니다.
        </div>
    </div>

    <script>
        function updateOnlineStatus() {
            const badge = document.getElementById('status-badge');
            const text = document.getElementById('status-text');
            if (navigator.onLine) {
                badge.className = 'status-badge online';
                text.innerHTML = '🟢 연결 복구됨! 페이지를 새로고침합니다...';
                setTimeout(() => {
                    window.location.reload();
                }, 1000);
            } else {
                badge.className = 'status-badge offline';
                text.innerHTML = '🔴 오프라인 대기 중 (네트워크 확인 필요)';
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        async function handleRetry() {
            const btn = document.getElementById('retry-btn');
            btn.disabled = true;
            btn.innerText = '연결 상태 확인 중...';
            try {
                const res = await fetch('/favicon.svg?t=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
                if (res.ok) {
                    window.location.reload();
                    return;
                }
            } catch (e) {}
            btn.disabled = false;
            btn.innerText = '🔄 다시 시도';
            alert('아직 서버에 연결되지 않았습니다. Wi-Fi 또는 모바일 데이터를 확인해 주세요.');
        }

        // 초기 로드 시 온라인 상태면 즉시 재시도
        if (navigator.onLine) {
            updateOnlineStatus();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JG 통합 포털</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- 상단 공통 내비게이션 바 -->
    <header class="top-nav">
        <div class="nav-container">
            <a href="/" class="brand">🏠 JG 포털</a>
            <nav class="nav-menu">
                <a href="/" class="active">홈</a>
                <a href="/go/blood">혈압 관리</a>
                <a href="/go/asset">자산 관리</a>
                <a href="/go/news">뉴스 브리핑</a>
                <a href="/logout" class="btn-logout">로그아웃</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="welcome-section">
            <h2>안녕하세요, <span id="usernameDisplay">사용자</span>님 👋</h2>
            <p>오늘의 통합 서비스 현황을 한눈에 확인하고 바로 이동하세요.</p>
        </section>

        <!-- 서비스 바로가기 카드 그리드 -->
        <div class="card-grid">
            <!-- 1. 혈압 관리 카드 -->
            <a href="/go/blood" class="service-card card-blood">
                <div class="card-icon">💖</div>
                <h3>혈압 관리</h3>
                <p class="card-desc">혈압 및 맥박 기록, 병원 일정, 투약 알림 관리</p>
                <div class="card-summary" id="bloodSummary">
                    <span>최근 기록 조회 중...</span>
                </div>
                <span class="card-link-btn">혈압 관리 열기 →</span>
            </a>

            <!-- 2. 자산 관리 카드 -->
            <a href="/go/asset" class="service-card card-asset">
                <div class="card-icon">💰</div>
                <h3>자산 관리</h3>
                <p class="card-desc">월별 자산 추이 및 금융 포트폴리오 분석</p>
                <div class="card-summary">
                    <span>자산 대시보드로 이동</span>
                </div>
                <span class="card-link-btn">자산 관리 열기 →</span>
            </a>

            <!-- 3. 뉴스 브리핑 카드 -->
            <a href="/go/news" class="service-card card-news">
                <div class="card-icon">📰</div>
                <h3>뉴스 브리핑</h3>
                <p class="card-desc">실시간 AI 뉴스 수집 및 모닝 텔레그램 브리핑</p>
                <div class="card-summary">
                    <span>뉴스 대시보드로 이동</span>
                </div>
                <span class="card-link-btn">뉴스 브리핑 열기 →</span>
            </a>
        </div>
    </main>

    <script>
        // 로그인한 사용자 이름 가져오기
        fetch('/api/me')
            .then(res => res.json())
            .then(data => {
                if (data.success && data.username) {
                    document.getElementById('usernameDisplay').textContent = data.username;
                }
            })
            .catch(() => {});

        // 혈압 최근 요약 데이터 가져오기
        fetch('/api/summary')
            .then(res => res.json())
            .then(data => {
                const summaryEl = document.getElementById('bloodSummary');
                if (data.success && data.blood) {
                    const b = data.blood;
                    summaryEl.innerHTML = `<strong>최근 측정:</strong> ${b.systolic}/${b.diastolic} mmHg (맥박 ${b.pulse}회)`;
                } else {
                    summaryEl.textContent = '최근 등록된 혈압 기록이 없습니다.';
                }
            })
            .catch(() => {
                document.getElementById('bloodSummary').textContent = '데이터를 불러올 수 없습니다.';
            });
    </script>
</body>
</html>

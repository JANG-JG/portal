<!-- 🔑 관리자 마스터 비밀번호 변경 전용 팝업 모달 -->
<div id="adminPasswordModal" class="admin-modal-backdrop" style="display:none;" onclick="handlePasswordModalBackdropClick(event)">
    <div class="admin-modal-dialog">
        <div class="admin-modal-header">
            <h3>🔑 마스터 비밀번호 변경</h3>
            <button type="button" class="admin-modal-close-btn" onclick="closeAdminPasswordModal()" title="창 닫기">✕</button>
        </div>
        <div class="admin-modal-body">
            <p style="font-size:0.875rem; color:#64748b; margin-top:0; margin-bottom:1.15rem;">
                변경 즉시 모든 서브 서비스(혈압, 자산, 뉴스)의 로그인 비밀번호가 동기화됩니다.
            </p>
            <form onsubmit="changeAdminPassword(event)">
                <div style="margin-bottom:0.85rem;">
                    <label style="display:block; font-size:0.85rem; font-weight:600; color:#334155; margin-bottom:0.35rem;">현재 비밀번호</label>
                    <input type="password" id="currentPassInput" required style="width:100%; padding:0.65rem 0.75rem; border:1px solid #cbd5e1; border-radius:0.5rem; box-sizing:border-box;">
                </div>
                <div style="margin-bottom:0.85rem;">
                    <label style="display:block; font-size:0.85rem; font-weight:600; color:#334155; margin-bottom:0.35rem;">새 비밀번호</label>
                    <input type="password" id="newPassInput" required style="width:100%; padding:0.65rem 0.75rem; border:1px solid #cbd5e1; border-radius:0.5rem; box-sizing:border-box;">
                </div>
                <div style="margin-bottom:1.15rem;">
                    <label style="display:block; font-size:0.85rem; font-weight:600; color:#334155; margin-bottom:0.35rem;">새 비밀번호 확인</label>
                    <input type="password" id="confirmPassInput" required style="width:100%; padding:0.65rem 0.75rem; border:1px solid #cbd5e1; border-radius:0.5rem; box-sizing:border-box;">
                </div>
                <div style="display:flex; gap:0.5rem; justify-content:flex-end;">
                    <button type="button" class="btn-admin btn-admin-outline" onclick="closeAdminPasswordModal()">취소</button>
                    <button type="submit" class="btn-admin btn-admin-primary">🔐 비밀번호 안전하게 변경</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 🔗 1. 가족 초대 링크 생성 모달 -->
<div id="addFamilyModal" class="admin-modal-backdrop" style="display:none;">
    <div class="admin-modal-dialog">
        <div class="admin-modal-header">
            <h3>🔗 가족 초대 링크 생성</h3>
            <button type="button" class="admin-modal-close-btn" onclick="closeAddFamilyModal()" title="창 닫기">✕</button>
        </div>
        <div class="admin-modal-body">
            <p style="font-size:0.85rem; color:#64748b; margin-top:0; margin-bottom:1rem; line-height:1.45;">
                관리용 명칭을 입력하고 초대 링크를 발급하세요.<br>
                가족이 초대 링크 접속 시 <strong>프로필명, 아이디, 이메일, 비밀번호, 생년월일</strong>을 직접 입력해 가입합니다.
            </p>
            <form id="addFamilyForm" onsubmit="submitAddFamily(event)">
                <div style="margin-bottom:0.85rem;">
                    <label style="display:block; font-size:0.85rem; font-weight:600; color:#334155; margin-bottom:0.25rem;">관리용 명칭 (가족 호칭 메모) *</label>
                    <input type="text" id="inputAddNickname" placeholder="예: 어머니, 둘째, 막내" required style="width:100%; padding:0.6rem 0.75rem; border:1px solid #cbd5e1; border-radius:0.5rem; box-sizing:border-box;">
                </div>
                <div style="margin-bottom:1.15rem; background:#f8fafc; border:1px solid #e2e8f0; border-radius:0.5rem; padding:0.75rem;">
                    <label style="display:block; font-size:0.82rem; font-weight:700; color:#334155; margin-bottom:0.5rem;">이용 허용 서비스 선택</label>
                    <div id="addFamilyServiceCheckboxList" style="display:flex; flex-direction:column; gap:0.4rem; font-size:0.85rem; color:#334155;">
                        <label style="display:flex; align-items:center; gap:0.4rem; cursor:pointer;">
                            <input type="checkbox" id="chkAddServiceAlbum" data-service-id="album" checked> <span>📸 우리 가족 앨범</span>
                        </label>
                        <label style="display:flex; align-items:center; gap:0.4rem; cursor:pointer;">
                            <input type="checkbox" id="chkAddServiceWiki" data-service-id="wiki" checked> <span>📖 우리 가족 위키</span>
                        </label>
                        <label style="display:flex; align-items:center; gap:0.4rem; cursor:pointer;">
                            <input type="checkbox" id="chkAddServiceNews" data-service-id="news" checked> <span>📰 뉴스룸 & 날씨·증시</span>
                        </label>
                        <label style="display:flex; align-items:center; gap:0.4rem; cursor:pointer; color:#94a3b8;">
                            <input type="checkbox" id="chkAddServiceAsset" data-service-id="asset"> <span>💰 자산 관리 (관리자 전용 비공개 권장)</span>
                        </label>
                        <label style="display:flex; align-items:center; gap:0.4rem; cursor:pointer; color:#94a3b8;">
                            <input type="checkbox" id="chkAddServiceBlood" data-service-id="blood"> <span>🩸 혈압 관리 (향후 프로필 분리 예정)</span>
                        </label>
                    </div>
                </div>
                <div style="display:flex; gap:0.5rem; justify-content:flex-end;">
                    <button type="button" class="btn-admin btn-admin-outline" onclick="closeAddFamilyModal()">취소</button>
                    <button type="submit" class="btn-admin btn-admin-primary">초대 링크 발급하기</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- ✏️ 2. 가족 정보 및 권한 수정 모달 -->
<div id="editFamilyModal" class="admin-modal-backdrop" style="display:none;">
    <div class="admin-modal-dialog">
        <div class="admin-modal-header">
            <h3>✏️ 가족 정보 및 이용 권한 수정</h3>
            <button type="button" class="admin-modal-close-btn" onclick="closeEditFamilyModal()" title="창 닫기">✕</button>
        </div>
        <div class="admin-modal-body">
            <form id="editFamilyForm" onsubmit="submitEditFamily(event)">
                <input type="hidden" id="editFamilyTargetUsername">
                <div style="margin-bottom:0.75rem;">
                    <label style="display:block; font-size:0.85rem; font-weight:600; color:#334155; margin-bottom:0.25rem;">관리용 명칭 (가족 호칭 메모) *</label>
                    <input type="text" id="inputEditAdminMemo" required style="width:100%; padding:0.55rem 0.75rem; border:1px solid #cbd5e1; border-radius:0.5rem; box-sizing:border-box;">
                </div>
                <div style="margin-bottom:0.75rem;">
                    <label style="display:block; font-size:0.85rem; font-weight:600; color:#334155; margin-bottom:0.25rem;">활동 프로필명 (가족 닉네임)</label>
                    <input type="text" id="inputEditNickname" style="width:100%; padding:0.55rem 0.75rem; border:1px solid #cbd5e1; border-radius:0.5rem; box-sizing:border-box;">
                </div>
                <div style="margin-bottom:0.75rem;">
                    <label style="display:block; font-size:0.85rem; font-weight:600; color:#334155; margin-bottom:0.25rem;">이메일 주소</label>
                    <input type="email" id="inputEditEmail" placeholder="example@email.com" style="width:100%; padding:0.55rem 0.75rem; border:1px solid #cbd5e1; border-radius:0.5rem; box-sizing:border-box;">
                </div>
                <div style="margin-bottom:0.85rem;">
                    <label style="display:block; font-size:0.85rem; font-weight:600; color:#334155; margin-bottom:0.25rem;">생년월일</label>
                    <input type="text" id="inputEditBirthdate" placeholder="예: 1995-05-15 또는 950515" style="width:100%; padding:0.55rem 0.75rem; border:1px solid #cbd5e1; border-radius:0.5rem; box-sizing:border-box;">
                </div>
                <div style="margin-bottom:1.15rem; background:#f8fafc; border:1px solid #e2e8f0; border-radius:0.5rem; padding:0.75rem;">
                    <label style="display:block; font-size:0.82rem; font-weight:700; color:#334155; margin-bottom:0.5rem;">이용 허용 서비스 선택</label>
                    <div id="editFamilyServiceCheckboxList" style="display:flex; flex-direction:column; gap:0.4rem; font-size:0.85rem; color:#334155;">
                        <label style="display:flex; align-items:center; gap:0.4rem; cursor:pointer;">
                            <input type="checkbox" id="chkEditServiceAlbum" data-service-id="album"> <span>📸 우리 가족 앨범</span>
                        </label>
                        <label style="display:flex; align-items:center; gap:0.4rem; cursor:pointer;">
                            <input type="checkbox" id="chkEditServiceWiki" data-service-id="wiki"> <span>📖 우리 가족 위키</span>
                        </label>
                        <label style="display:flex; align-items:center; gap:0.4rem; cursor:pointer;">
                            <input type="checkbox" id="chkEditServiceNews" data-service-id="news"> <span>📰 뉴스룸 & 날씨·증시</span>
                        </label>
                        <label style="display:flex; align-items:center; gap:0.4rem; cursor:pointer;">
                            <input type="checkbox" id="chkEditServiceAsset" data-service-id="asset"> <span>💰 자산 관리</span>
                        </label>
                        <label style="display:flex; align-items:center; gap:0.4rem; cursor:pointer;">
                            <input type="checkbox" id="chkEditServiceBlood" data-service-id="blood"> <span>🩸 혈압 관리</span>
                        </label>
                    </div>
                </div>
                <div style="display:flex; gap:0.5rem; justify-content:flex-end;">
                    <button type="button" class="btn-admin btn-admin-outline" onclick="closeEditFamilyModal()">취소</button>
                    <button type="submit" class="btn-admin btn-admin-primary">수정사항 저장</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 🔑 3. 임시 PIN 재설정 모달 -->
<div id="resetPinModal" class="admin-modal-backdrop" style="display:none;">
    <div class="admin-modal-dialog">
        <div class="admin-modal-header">
            <h3>🔑 임시 PIN 재설정</h3>
            <button type="button" class="admin-modal-close-btn" onclick="closeResetPinModal()" title="창 닫기">✕</button>
        </div>
        <div class="admin-modal-body">
            <p style="font-size:0.85rem; color:#64748b; margin-top:0; margin-bottom:0.85rem;">
                [<strong id="resetPinTargetNameDisplay">-</strong>]님의 로그인 PIN을 임시 번호로 재설정합니다.
            </p>
            <form onsubmit="submitResetPin(event)">
                <input type="hidden" id="resetPinTargetUsername">
                <div style="margin-bottom:1.15rem;">
                    <label style="display:block; font-size:0.85rem; font-weight:600; color:#334155; margin-bottom:0.25rem;">새 임시 숫자 6자리 PIN</label>
                    <input type="text" id="inputResetNewPin" value="123456" maxlength="6" inputmode="numeric" required style="width:100%; padding:0.6rem 0.75rem; border:1px solid #cbd5e1; border-radius:0.5rem; font-family:monospace; font-size:1.1rem; letter-spacing:2px; box-sizing:border-box;">
                    <span style="font-size:0.75rem; color:#64748b; display:block; margin-top:0.25rem;">가족에게 전달 후, 로그인하면 본인만의 PIN으로 즉시 변경됩니다.</span>
                </div>
                <div style="display:flex; gap:0.5rem; justify-content:flex-end;">
                    <button type="button" class="btn-admin btn-admin-outline" onclick="closeResetPinModal()">취소</button>
                    <button type="submit" class="btn-admin btn-admin-primary">PIN 재설정 완료</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 🗄️ 단일 레코드 추가/수정 모달 -->
<div id="dbRowModal" class="admin-modal-backdrop" style="display:none;" onclick="if(event.target===this)DbManager.closeRowModal()">
    <div class="admin-modal-dialog" style="max-width:560px;">
        <div class="admin-modal-header">
            <h3 id="dbRowModalTitle">➕ 레코드 관리</h3>
            <button type="button" class="admin-modal-close-btn" onclick="DbManager.closeRowModal()" title="창 닫기">✕</button>
        </div>
        <div class="admin-modal-body" style="max-height:75vh; overflow-y:auto;">
            <form id="dbRowForm" onsubmit="DbManager.submitRowForm(event)">
                <!-- 동적 컬럼 폼 주입 -->
            </form>
        </div>
        <div style="padding:1rem 1.25rem; border-top:1px solid #e2e8f0; display:flex; justify-content:flex-end; gap:0.5rem; background:#f8fafc; border-bottom-left-radius:0.75rem; border-bottom-right-radius:0.75rem;">
            <button type="button" class="btn-admin btn-admin-outline" onclick="DbManager.closeRowModal()">취소</button>
            <button type="button" class="btn-admin btn-admin-primary" onclick="document.getElementById('dbRowForm').requestSubmit()">💾 저장 완료</button>
        </div>
    </div>
</div>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>AI 비서 - JG 포털</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FAF9F5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="JG AI비서">
    <meta name="color-scheme" content="light">

    <!-- 스타일시트 (Claude 에디토리얼 모듈형 CSS) -->
    <link rel="stylesheet" href="/css/pretendard.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/portal-ai-base.css">
    <link rel="stylesheet" href="/css/portal-ai-messages.css">
    <link rel="stylesheet" href="/css/portal-ai-composer.css">
</head>
<body>
    <div class="ai-app-wrapper">
        <!-- 1. 좌측 대화 관리 사이드바 (모바일은 슬라이드 드로어) -->
        <aside class="ai-sidebar" id="aiSidebar">
            <div class="ai-sidebar-header">
                <div class="ai-sidebar-brand">
                    <span class="ai-sidebar-avatar">🤖</span>
                    <div class="ai-sidebar-title-wrap">
                        <div class="ai-sidebar-title">AI 비서</div>
                        <div class="ai-sidebar-badge" id="aiSidebarModelBadge">LG 엑사원 3.5 🟢</div>
                    </div>
                </div>
                <button type="button" class="ai-sidebar-close-btn" id="aiSidebarCloseBtn" onclick="toggleSidebar(false)" aria-label="사이드바 닫기">✕</button>
            </div>

            <div class="ai-sidebar-action">
                <button type="button" class="ai-new-chat-btn" id="aiNewChatBtn" onclick="handleNewChatClick()">
                    <span class="ai-new-chat-icon">➕</span>
                    <span class="ai-new-chat-text">새 대화 시작하기</span>
                </button>
            </div>

            <!-- 지난 대화 목록 및 검색 -->
            <div class="ai-history-section">
                <div class="ai-history-search-wrap">
                    <input type="search" id="aiHistorySearchInput" class="ai-history-search-input" placeholder="대화 제목/내용 검색..." autocomplete="off">
                    <span class="ai-history-search-icon">🔍</span>
                </div>
                <div class="ai-history-section-title">
                    <span>💬 지난 대화 목록</span>
                    <span class="ai-history-count-badge" id="aiHistoryCount">0</span>
                </div>
                <div class="ai-sidebar-history-list" id="aiSidebarHistoryList">
                    <!-- portal-ai-page.js에서 동적 렌더링 -->
                </div>
            </div>

            <!-- 사이드바 하단 바로가기 메뉴 -->
            <div class="ai-sidebar-footer">
                <a href="/wiki" class="ai-footer-link">
                    <span class="ai-footer-icon">📚</span>
                    <span>가족 위키 지식</span>
                </a>
                <a href="/" class="ai-footer-link">
                    <span class="ai-footer-icon">🏠</span>
                    <span>메인 대시보드</span>
                </a>
            </div>
        </aside>

        <!-- 모바일 백드롭 딤 오버레이 -->
        <div class="ai-sidebar-backdrop" id="aiSidebarBackdrop" onclick="toggleSidebar(false)"></div>

        <!-- 2. 중앙 챗 캔버스 (대화 영역) -->
        <main class="ai-main-canvas">
            <!-- 모바일 슬림 헤더 -->
            <header class="ai-mobile-header">
                <button type="button" class="ai-mobile-menu-btn" onclick="toggleSidebar(true)" aria-label="대화 목록 열기">
                    <span class="ai-menu-icon">☰</span>
                </button>
                <div class="ai-mobile-title-wrap">
                    <span class="ai-mobile-title" id="aiMobileSessionTitle">AI 비서</span>
                </div>
                <button type="button" class="ai-mobile-action-btn" onclick="handleNewChatClick()" title="새 대화">
                    <span>➕</span>
                </button>
            </header>

            <!-- 메시지 스크롤 컨테이너 -->
            <div class="ai-messages-scroll" id="aiMessagesScroll">
                <div class="ai-messages-container" id="aiMessagesContainer">
                    <!-- 메시지 버블이 동적으로 마운트되는 영역 -->
                </div>
            </div>

            <!-- 추천 질문 칩 바 (컴포저 박스 외부 독립 슬림 바) -->
            <div class="ai-prompt-chips-bar" id="aiPromptChipsBar">
                <button type="button" class="ai-chip-btn" onclick="sendQuickPrompt('오늘 챙겨야 할 주요 일정과 메모 알려줘')">📅 오늘 일정</button>
                <button type="button" class="ai-chip-btn" onclick="sendQuickPrompt('오늘 주요 뉴스와 실시간 속보 알려줘')">📰 주요 뉴스</button>
                <button type="button" class="ai-chip-btn" onclick="sendQuickPrompt('오늘 날씨와 외출 옷차림 팁 알려줘')">🌤️ 날씨 팁</button>
                <button type="button" class="ai-chip-btn" onclick="sendQuickPrompt('주서버와 보조서버 가동 상태 알려줘')">🖥️ 서버 상태</button>
                <button type="button" class="ai-chip-btn" onclick="sendQuickPrompt('위키에 저장된 생활 팁 추천해줘')">📚 위키 추천</button>
            </div>

            <!-- 하단 고정 프롬프트 입력 영역 (인풋창과 1:1 일치 단일 섹션) -->
            <div class="ai-composer-wrapper" id="aiComposerWrapper">
                <!-- 입력 폼 -->
                <form class="ai-composer-form" id="aiComposerForm" onsubmit="handleComposerSubmit(event)">
                    <div class="ai-input-box">
                        <textarea 
                            id="aiPromptInput" 
                            class="ai-prompt-textarea" 
                            rows="1" 
                            placeholder="메시지를 입력하세요..." 
                            autocomplete="off"
                            maxlength="1000"></textarea>
                        <div class="ai-input-bottom-bar">
                            <div class="ai-input-bottom-left">
                                <span id="aiCharCount" class="ai-char-counter" title="현재 글자 수 / 최대 1,000자">0/1000</span>
                            </div>
                            <div class="ai-input-bottom-right">
                                <button type="button" id="aiVoiceBtn" class="ai-voice-btn" aria-label="음성으로 말하기" title="음성으로 입력하기">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                        <line x1="12" y1="19" x2="12" y2="23"></line>
                                        <line x1="8" y1="23" x2="16" y2="23"></line>
                                    </svg>
                                </button>
                                <button type="submit" id="aiSubmitBtn" class="ai-send-btn" aria-label="메시지 전송" title="메시지 전송 (최대 1,000자)">
                                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="22" y1="2" x2="11" y2="13"></line>
                                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </form>

                <div class="ai-disclaimer">
                    <span>🛡️ 가족 데이터 전용 로컬 AI (LG EXAONE 3.5) • 1회 질문당 최대 1,000자</span>
                </div>
            </div>
        </main>
    </div>

    <!-- 스크립트 (캐시 제어는 deploy.sh 및 server.js가 자동 처리) -->
    <script src="/api/jg-ui" data-nav="false" data-ticker="false" defer></script>
    <script src="/js/portal-ai-voice.js"></script>
    <script src="/js/portal-ai-history.js"></script>
    <script src="/js/portal-ai-thinking.js"></script>
    <script src="/js/portal-ai-render.js"></script>
    <script src="/js/portal-ai-viewport.js"></script>
    <script src="/js/portal-ai-stream.js"></script>
    <script src="/js/portal-ai-page.js"></script>
</body>
</html>
